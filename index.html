<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>The Americano Co. - Dijital Menü</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #111; --text: #fff; --accent: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { text-align: center; padding: 30px; cursor: pointer; }
        .logo { max-width: 180px; height: auto; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px 60px 15px; }
        
        /* Navigasyon - Siyah ekranı önleyen yapı */
        #navBar { display: none; padding: 10px 0; margin-bottom: 15px; }
        .back-btn { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 12px 20px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 10px; }

        /* Kategori Grid */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .cat-btn { background: var(--card); border: 1px solid #333; border-radius: 15px; padding: 30px 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .cat-btn i { font-size: 2.2rem; }

        /* Ürün Kartları */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .menu-item { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        .img-box { width: 100%; position: relative; padding-top: 100%; background: #222; }
        .menu-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .menu-info { padding: 12px; }
        .item-name { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; margin: 0; }
        .item-price { font-size: 1rem; font-weight: bold; text-align: right; margin-top: 8px; }

        /* Liste */
        .classic-list { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #222; }
        .classic-item { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
        .dots { flex-grow: 1; border-bottom: 1px dotted #444; margin: 0 8px 4px 8px; }

        /* Bölüm Ayarları */
        .page-section { display: none; }
        .active-section { display: block !important; }
        
        h2 { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal img { max-width: 95%; max-height: 90%; }
        footer { text-align: center; padding: 20px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="imgModal" class="modal" onclick="this.style.display='none'"><img id="modalImg"></div>
    <header onclick="goHome()"><img src="logo.jpg" class="logo"></header>
    <div class="container">
        <div id="navBar"><button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Geri Dön</button></div>

        <div id="home-screen" class="page-section active-section">
            <div class="category-grid">
                <div class="cat-btn" onclick="showCat('coffee')"><i class="fas fa-mug-hot"></i><span>Kahveler</span></div>
                <div class="cat-btn" onclick="showCat('desserts')"><i class="fas fa-cookie-bite"></i><span>Tatlılar</span></div>
                <div class="cat-btn" onclick="showCat('cold')"><i class="fas fa-glass-whiskey"></i><span>Soğuklar</span></div>
                <div class="cat-btn" onclick="showCat('food')"><i class="fas fa-utensils"></i><span>Kruvasan</span></div>
            </div>
        </div>

        <div id="coffee" class="page-section">
            <h2>Kahveler</h2>
            <div class="menu-grid">
                <div class="menu-item"><div class="img-box"><img src="espresso.jpg" class="menu-img" onclick="openM(this)"></div><div class="menu-info"><p class="item-name">Espresso</p><div class="item-price">150₺</div></div></div>
                <div class="menu-item"><div class="img-box"><img src="latte.jpg" class="menu-img" onclick="openM(this)"></div><div class="menu-info"><p class="item-name">Latte</p><div class="item-price">250₺</div></div></div>
            </div>
            <div class="classic-list">
                <div class="classic-item"><span>Americano</span><span class="dots"></span><span>220₺</span></div>
                <div class="classic-item"><span>Filtre Kahve</span><span class="dots"></span><span>200₺</span></div>
            </div>
        </div>

        <div id="desserts" class="page-section">
            <h2>Tatlılar</h2>
            <div class="menu-grid">
                <div class="menu-item"><div class="img-box"><img src="king.jpg" class="menu-img" onclick="openM(this)"></div><div class="menu-info"><p class="item-name">King</p><div class="item-price">430₺</div></div></div>
                <div class="menu-item"><div class="img-box"><img src="fiesta.jpg" class="menu-img" onclick="openM(this)"></div><div class="menu-info"><p class="item-name">Fiesta</p><div class="item-price">430₺</div></div></div>
            </div>
        </div>
    </div>
    <script>
        function showCat(id) {
            document.querySelectorAll('.page-section').forEach(s => { s.style.display = 'none'; s.classList.remove('active-section'); });
            var target = document.getElementById(id);
            target.style.display = 'block';
            target.classList.add('active-section');
            document.getElementById('navBar').style.display = 'block';
            document.getElementById('home-screen').style.display = 'none';
            window.scrollTo(0,0);
        }
        function goHome() {
            document.querySelectorAll('.page-section').forEach(s => { s.style.display = 'none'; s.classList.remove('active-section'); });
            var home = document.getElementById('home-screen');
            home.style.display = 'block';
            home.classList.add('active-section');
            document.getElementById('navBar').style.display = 'none';
            window.scrollTo(0,0);
        }
        function openM(el) { document.getElementById('imgModal').style.display = 'flex'; document.getElementById('modalImg').src = el.src; }
    </script>
</body>
</html>
